<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moncler Global Price Comparison</title>
    <style>
        :root {
            --bg-dark: #121212;
            --surface-dark: #1e1e1e;
            --text-primary: #f5f5f5;
            --text-secondary: #aaaaaa;
            --accent-gold: #d4af37;
            --border-color: #333333;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .app-header {
            text-align: center;
            padding: 3rem 1.5rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-family: 'Didot', 'Bodoni MT', serif;
            font-weight: 400;
            font-size: 2rem;
            letter-spacing: 2px;
            margin: 0 0 0.5rem 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        select {
            appearance: none;
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 1rem;
            font-size: 1rem;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        select:focus {
            border-color: var(--accent-gold);
        }

        button {
            background-color: var(--text-primary);
            color: var(--bg-dark);
            border: none;
            padding: 1rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 1rem;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: var(--accent-gold);
            color: var(--bg-dark);
        }

        #results-container {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        #product-image-container {
            width: 100%;
            max-width: 300px;
            margin: 0 auto 1.5rem auto;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #product-image {
            width: 100%;
            height: auto;
            display: block;
        }

        #results-title {
            font-family: 'Didot', serif;
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
        }

        #results-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .best-deal-card {
            background: linear-gradient(145deg, #1f1f1f, #181818);
            border: 1px solid var(--accent-gold);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .best-deal-card h2 {
            color: var(--accent-gold);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 1rem 0;
        }

        .best-deal-card p {
            font-size: 1.1rem;
            margin: 0;
            font-weight: 300;
            color: var(--text-primary);
        }

        .best-deal-card strong {
            font-weight: 600;
        }

        /* Mobile-friendly table replacement: List Cards */
        .result-card {
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }

        .result-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .store-location {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .final-cost {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .result-detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .detail-label {
            color: var(--text-secondary);
        }

        .detail-value {
            font-weight: 500;
        }

        .value-green { color: #81c784; }
        .value-red { color: #e57373; }
        .value-primary { color: var(--text-primary); }

        @media (min-width: 768px) {
            .container { padding: 4rem 2rem; }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <h1>Moncler</h1>
        <div class="subtitle">Global Price Intelligence</div>
    </header>

    <div class="container">
        <form id="compare-form" onsubmit="return false;">
            <div class="form-group">
                <label for="user_country">Your Residency</label>
                <select id="user_country" name="user_country" required>
                    <option value="US">United States (US)</option>
                    <option value="IT">Italy (IT)</option>
                    <option value="GB">United Kingdom (GB)</option>
                    <option value="JP">Japan (JP)</option>
                    <option value="FR">France (FR)</option>
                    <option value="DE">Germany (DE)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="product_name">Select Piece</label>
                <select id="product_name" name="product_name" required>
                    <option value="Maya Short Down Jacket">Maya Short Down Jacket</option>
                    <option value="Bormes Gilet">Bormes Gilet</option>
                    <option value="Montbeliard Short Down Jacket">Montbeliard Short Down Jacket</option>
                    <option value="Grenoble Hintertux Ski Jacket">Grenoble Hintertux Ski Jacket</option>
                    <option value="Logo Wool Beanie">Logo Wool Beanie</option>
                </select>
            </div>

            <button type="submit">Compare Intelligence</button>
        </form>

        <div id="results-container">
            <div class="results-header">
                <h2 id="results-title"></h2>
                <div id="results-subtitle"></div>
            </div>

            <div id="product-image-container">
                <img id="product-image" src="" alt="Product Image">
            </div>

            <div class="best-deal-card" id="best-deal">
                <!-- Best deal populated here -->
            </div>

            <div id="results-body">
                <!-- Mobile-friendly cards populated here -->
            </div>
        </div>
    </div>

    <script>
        // Mock Database
        const mockData = [
            // Maya Short Down Jacket
            { product_name: "Maya Short Down Jacket", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/I20911A5360068950999_M/dpx6uv/std/1024x1536/maya-short-down-jacket.jpg", country: "US", currency: "USD", price: 1850.00 },
            { product_name: "Maya Short Down Jacket", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/I20911A5360068950999_M/dpx6uv/std/1024x1536/maya-short-down-jacket.jpg", country: "IT", currency: "EUR", price: 1250.00 },
            { product_name: "Maya Short Down Jacket", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/I20911A5360068950999_M/dpx6uv/std/1024x1536/maya-short-down-jacket.jpg", country: "GB", currency: "GBP", price: 1150.00 },
            { product_name: "Maya Short Down Jacket", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/I20911A5360068950999_M/dpx6uv/std/1024x1536/maya-short-down-jacket.jpg", country: "JP", currency: "JPY", price: 240000.00 },
            // Bormes Gilet
            { product_name: "Bormes Gilet", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/H20911A0014453333999_M/e9j0kq/std/1024x1536/bormes-gilet.jpg", country: "US", currency: "USD", price: 1200.00 },
            { product_name: "Bormes Gilet", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/H20911A0014453333999_M/e9j0kq/std/1024x1536/bormes-gilet.jpg", country: "IT", currency: "EUR", price: 850.00 },
            { product_name: "Bormes Gilet", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/H20911A0014453333999_M/e9j0kq/std/1024x1536/bormes-gilet.jpg", country: "GB", currency: "GBP", price: 790.00 },
            // Montbeliard Short Down Jacket
            { product_name: "Montbeliard Short Down Jacket", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/I20911A0014268950999_M/a3xw5z/std/1024x1536/montbeliard-short-down-jacket.jpg", country: "US", currency: "USD", price: 2150.00 },
            { product_name: "Montbeliard Short Down Jacket", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/I20911A0014268950999_M/a3xw5z/std/1024x1536/montbeliard-short-down-jacket.jpg", country: "IT", currency: "EUR", price: 1550.00 },
            { product_name: "Montbeliard Short Down Jacket", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/I20911A0014268950999_M/a3xw5z/std/1024x1536/montbeliard-short-down-jacket.jpg", country: "GB", currency: "GBP", price: 1400.00 },
            // Grenoble Hintertux Ski Jacket
            { product_name: "Grenoble Hintertux Ski Jacket", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/I20971A0003053071999_M/8zjw3v/std/1024x1536/hintertux-short-down-jacket.jpg", country: "US", currency: "USD", price: 2450.00 },
            { product_name: "Grenoble Hintertux Ski Jacket", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/I20971A0003053071999_M/8zjw3v/std/1024x1536/hintertux-short-down-jacket.jpg", country: "IT", currency: "EUR", price: 1800.00 },
            { product_name: "Grenoble Hintertux Ski Jacket", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/I20971A0003053071999_M/8zjw3v/std/1024x1536/hintertux-short-down-jacket.jpg", country: "GB", currency: "GBP", price: 1650.00 },
            // Logo Wool Beanie
            { product_name: "Logo Wool Beanie", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/I20913B00052A9327999_M/4yjw3v/std/1024x1536/wool-beanie.jpg", country: "US", currency: "USD", price: 345.00 },
            { product_name: "Logo Wool Beanie", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/I20913B00052A9327999_M/4yjw3v/std/1024x1536/wool-beanie.jpg", country: "IT", currency: "EUR", price: 250.00 },
            { product_name: "Logo Wool Beanie", image_url: "https://moncler-cdn.thron.com/delivery/public/image/moncler/I20913B00052A9327999_M/4yjw3v/std/1024x1536/wool-beanie.jpg", country: "GB", currency: "GBP", price: 230.00 }
        ];

        // Currency Mapping & Exchange Rates
        const COUNTRY_CURRENCY_MAP = {
            "US": "USD", "IT": "EUR", "GB": "GBP", "JP": "JPY", "FR": "EUR", "DE": "EUR"
        };
        const EXCHANGE_RATES = {
            "USD": 1.0, "EUR": 1.08, "GBP": 1.26, "JPY": 0.0067
        };

        function getExchangeRate(fromCurrency, toCurrency) {
            if (fromCurrency === toCurrency) return 1.0;
            const rateToUsd = EXCHANGE_RATES[fromCurrency];
            const toRate = EXCHANGE_RATES[toCurrency];
            if (!rateToUsd || !toRate) return 1.0; // fallback
            const rateFromUsd = 1 / toRate;
            return rateToUsd * rateFromUsd;
        }

        function convertCurrency(amount, fromCurrency, toCurrency) {
            const rate = getExchangeRate(fromCurrency, toCurrency);
            return amount * rate;
        }

        function calculateAdjustedPrice(basePrice, productCountry, userCountry, priceCurrency, userCurrency) {
            const priceInUsd = convertCurrency(basePrice, priceCurrency, "USD");

            let refundPct = 0.0;
            let dutyPct = 0.0;

            if (userCountry !== productCountry) {
                if (productCountry === "IT" && !["IT", "FR", "DE"].includes(userCountry)) {
                    refundPct = 0.12;
                } else if (productCountry === "GB") {
                    refundPct = 0.15;
                } else if (productCountry === "JP") {
                    refundPct = 0.10;
                }
            }

            const refundedPriceUsd = priceInUsd * (1 - refundPct);

            if (userCountry === "US" && userCountry !== productCountry) {
                if (refundedPriceUsd > 800) {
                    dutyPct = 0.05;
                }
            }

            const finalPriceUsd = refundedPriceUsd * (1 + dutyPct);
            const finalPriceUserCurr = convertCurrency(finalPriceUsd, "USD", userCurrency);
            const basePriceUserCurr = convertCurrency(basePrice, priceCurrency, userCurrency);
            const refundAmountUserCurr = convertCurrency(priceInUsd * refundPct, "USD", userCurrency);
            const dutyAmountUserCurr = convertCurrency(refundedPriceUsd * dutyPct, "USD", userCurrency);

            return {
                final_price: finalPriceUserCurr.toFixed(2),
                base_price_user_curr: basePriceUserCurr.toFixed(2),
                refund_amount: refundAmountUserCurr.toFixed(2),
                duty_amount: dutyAmountUserCurr.toFixed(2)
            };
        }

        document.getElementById('compare-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const userCountry = document.getElementById('user_country').value;
            const productName = document.getElementById('product_name').value;
            const userCurrency = COUNTRY_CURRENCY_MAP[userCountry];

            const productData = mockData.filter(item => item.product_name === productName);

            if (productData.length === 0) return;

            let resultsData = productData.map(item => {
                const adj = calculateAdjustedPrice(item.price, item.country, userCountry, item.currency, userCurrency);
                return {
                    product_country: item.country,
                    product_currency: item.currency,
                    original_price: item.price.toFixed(2),
                    base_price_converted: adj.base_price_user_curr,
                    tax_refund: adj.refund_amount,
                    import_duty: adj.duty_amount,
                    final_price: adj.final_price,
                    final_price_num: parseFloat(adj.final_price)
                };
            });

            // Sort by lowest price
            resultsData.sort((a, b) => a.final_price_num - b.final_price_num);

            // Update UI
            document.getElementById('results-title').textContent = productName;
            document.getElementById('results-subtitle').innerHTML = `Refined for <strong>${userCountry}</strong> | ${userCurrency}`;

            // Set image
            const productImage = document.getElementById('product-image');
            const productImageContainer = document.getElementById('product-image-container');
            if (productData[0] && productData[0].image_url) {
                productImage.src = productData[0].image_url;
                productImage.alt = productName;
                productImageContainer.style.display = 'block';
            } else {
                productImageContainer.style.display = 'none';
            }

            const cheapest = resultsData[0];
            document.getElementById('best-deal').innerHTML = `
                <h2>Top Recommendation</h2>
                <p>Acquire in <strong>${cheapest.product_country}</strong> for <strong>${userCurrency} ${cheapest.final_price}</strong></p>
            `;

            const tbody = document.getElementById('results-body');
            tbody.innerHTML = '';

            resultsData.forEach(item => {
                // Generate a mobile-friendly luxury card for each result instead of a row
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <div class="result-card-header">
                        <span class="store-location">${item.product_country} Boutique</span>
                        <span class="final-cost">${item.final_price} ${userCurrency}</span>
                    </div>
                    <div class="result-detail-row">
                        <span class="detail-label">Local Price</span>
                        <span class="detail-value value-primary">${item.original_price} ${item.product_currency}</span>
                    </div>
                    <div class="result-detail-row">
                        <span class="detail-label">Converted Base</span>
                        <span class="detail-value value-primary">${item.base_price_converted} ${userCurrency}</span>
                    </div>
                    <div class="result-detail-row">
                        <span class="detail-label">Est. Tax Refund</span>
                        <span class="detail-value value-green">-${item.tax_refund} ${userCurrency}</span>
                    </div>
                    <div class="result-detail-row">
                        <span class="detail-label">Est. Import Duty</span>
                        <span class="detail-value ${parseFloat(item.import_duty) > 0 ? 'value-red' : 'value-primary'}">+${item.import_duty} ${userCurrency}</span>
                    </div>
                `;
                tbody.appendChild(card);
            });

            document.getElementById('results-container').style.display = 'block';

            // Smooth scroll to results
            document.getElementById('results-container').scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>
